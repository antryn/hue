<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hue — Color Lookup</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into the query string so
      // the server serves index.html, then index.html decodes and restores it.
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + 1) // keep the sub-path segment count (1 = "/chroma-match")
            .join("/") +
          "/?p=" +
          encodeURIComponent(
            l.pathname.slice(1) + (l.search ? "&q=" + l.search.slice(1) : "") + l.hash,
          ),
      );
    </script>
  </head>
</html>
