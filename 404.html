<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hue — Color Lookup</title>
    <script>
      // GitHub Pages SPA fallback: encode the original path into ?p= and redirect
      // to index.html, which decodes it before the router boots.
      // Only needed for routes not prerendered (e.g. unknown paths).
      var seg = 1; // replaced at build time from vite.config.ts GITHUB_PAGES_BASE
      var l = window.location;
      var base = l.pathname.split("/").slice(0, seg + 1).join("/");
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        base + "/?p=" + encodeURIComponent(l.pathname.slice(base.length + 1)) +
        (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
        l.hash
      );
    </script>
  </head>
</html>
